[package]
name = "glyph-draft"
version = "0.1.0"
description = "Glyph Draft — an SVG editor for drawing font glyphs"
authors = ["Glyph Draft"]
edition = "2021"

[lib]
# The desktop entry point lives in the library so the same code can be reused
# by integration tests and (later) mobile targets.
name = "glyph_draft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
